<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دوايا">
<title>دوايا - تذكير الدواء</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#0E9F6E; --accent2:#0B7A55;
  --bg:#0F1512; --card:#1A221E; --card2:#212A25; --line:#2A332E;
  --text:#F0F2F1; --muted:#93A19A; --danger:#EF4444; --warn:#F59E0B; --ok:#4ADE80; --okink:#052E16;
  --nextbg:rgba(52,211,153,.14); --nextink:#34D399;
  --radius:16px; --shadow:0 2px 12px rgba(0,0,0,.28);
  --spring:cubic-bezier(.22,1,.36,1);
}
html[data-theme="light"]{
  --accent:#0E9F6E; --accent2:#0B7A55;
  --bg:#FAF8F4; --card:#FFFFFF; --card2:#F5F3EE; --line:#E9E5DC;
  --text:#1A1D21; --muted:#5C6B64; --danger:#DC2626; --warn:#F59E0B; --ok:#16A34A; --okink:#FFFFFF;
  --nextbg:#DFF3E8; --nextink:#0E7A52;
  --shadow:0 2px 12px rgba(26,43,38,.06);
}
.card{box-shadow:var(--shadow)}
html[data-theme="light"] .tabbarin{box-shadow:0 -4px 24px rgba(26,43,38,.06)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'IBM Plex Sans Arabic','Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;
  min-height:100dvh;overscroll-behavior:none;transition:background .35s,color .35s;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* header */
header{padding:calc(env(safe-area-inset-top) + 18px) 20px 8px;position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.greet{font-size:15px;color:var(--muted);font-weight:500}
.htitle{font-size:24px;font-weight:800;margin-top:2px}
main{flex:1;padding:10px 16px 120px;animation:fadein .35s var(--spring)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;transition:transform .25s var(--spring),background .35s,border-color .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
main .card{animation:pop .38s var(--spring) backwards}
main .card:nth-of-type(2){animation-delay:.045s}
main .card:nth-of-type(3){animation-delay:.09s}
main .card:nth-of-type(4){animation-delay:.135s}
main .card:nth-of-type(n+5){animation-delay:.18s}
.pressable:active{transform:scale(.975)}

/* today progress */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.ring{flex:none;width:56px;height:56px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .7s var(--spring)}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.heroinfo h2{font-size:20px;font-weight:700;margin-bottom:3px}
.heroinfo p{font-size:13.5px;color:var(--muted);line-height:1.55}
.nextdose{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;padding:8px 12px;border-radius:999px;width:100%;
  background:var(--nextbg);color:var(--nextink);font-size:13px;font-weight:700}

/* dose rows */
.dayhead{font-size:14px;font-weight:700;color:var(--muted);margin:18px 4px 8px}
.dose{display:flex;align-items:center;gap:13px;padding:14px 16px}
.dose .dot{flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px}
.dose .info{flex:1;min-width:0}
.dose .name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dose .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.dose .acts{display:flex;gap:8px}
.pillbtn{flex:none;width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:var(--card2);border:1px solid var(--line);transition:all .2s var(--spring)}
.pillbtn:active{transform:scale(.9)}
.pillbtn.ok.on{background:var(--ok);border-color:var(--ok);color:var(--okink);animation:popin .2s var(--spring)}
@keyframes popin{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.pillbtn.skip.on{background:var(--card2);border-color:var(--muted);color:var(--muted)}
.dose.taken{opacity:.62}
.dose.taken .name{text-decoration:line-through;text-decoration-color:var(--muted);text-decoration-thickness:1.5px}
.timechip{flex:none;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--card2);
  border:1px solid var(--line);border-radius:9px;padding:4px 9px;min-width:58px;text-align:center}

/* week strip */
.week{display:flex;justify-content:space-between;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.wday{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.wdot{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.wdot.full{background:color-mix(in srgb,var(--ok) 20%,transparent);border-color:var(--ok);color:var(--ok)}
.wdot.part{background:color-mix(in srgb,var(--warn) 16%,transparent);border-color:var(--warn);color:var(--warn)}
.wdot.miss{background:var(--card2);border-color:var(--line);color:var(--muted)}
.wdot.today{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.wlbl{font-size:12px;color:var(--muted);font-weight:700}

/* ad placeholder (mockup - AdMob slot goes here later) */
.adcard{margin:14px 0 2px;border:1.5px dashed var(--line);border-radius:var(--radius);
  padding:10px 14px;text-align:center;color:var(--muted);background:transparent}
.adcard .adtag{display:inline-block;font-size:12px;font-weight:800;
  border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin-bottom:8px;color:var(--muted)}
.adcard .adt{font-size:13.5px;font-weight:700}
.adcard .ads{font-size:12px;margin-top:4px;opacity:.75;line-height:1.6}

/* banner */
.banner{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;border-radius:16px;margin-bottom:12px;
  font-size:13.5px;font-weight:600;line-height:1.6}
.banner.neutral{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.banner svg{flex:none;width:18px;height:18px;margin-top:2px}
.banner.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.info{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--nextink);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}

/* med list */
.medrow{display:flex;align-items:center;gap:13px}
.medrow .dot{flex:none;width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:21px}
.medrow .info{flex:1;min-width:0}
.medrow .name{font-weight:700;font-size:16px}
.medrow .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.medrow .chev{color:var(--muted);font-size:18px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--muted);margin-inline-start:5px}
.tag.low{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}

/* history */
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding:8px 2px 0}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:22px;border-radius:6px;background:var(--accent);opacity:.9;min-height:4px;transition:height .5s var(--spring)}
.bar.none{background:var(--card2);border:1px dashed var(--line)}
.barday{font-size:12px;color:var(--muted);font-weight:600}
.statrow{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stat .n{font-size:32px;font-weight:800;color:var(--accent)}
.stat .l{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}

/* settings */
.setrow{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:12px;min-height:56px}
.setrow + .setrow{border-top:1px solid var(--line)}
.setrow .t{font-weight:700;font-size:15px}
.setrow .d{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{min-height:38px;padding:6px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);transition:all .2s}
.seg button.on{background:var(--accent);color:#fff}
.swatches{display:flex;gap:10px}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid transparent;transition:transform .2s var(--spring)}
.sw.on{border-color:#fff;transform:scale(1.18);box-shadow:0 0 0 2px var(--bg),0 0 0 4px currentColor}
.switch{flex:none;width:70px;height:50px;border:10px solid transparent;background-clip:padding-box;border-radius:999px;background-color:var(--card2);box-shadow:inset 0 0 0 1px var(--line);position:relative;transition:background-color .25s}
.switch::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:all .25s var(--spring);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.switch.on{background-color:var(--accent);box-shadow:none}
.switch.on::after{transform:translateX(-20px)}
.linkrow{color:var(--accent);font-weight:700;font-size:14.5px;min-height:48px;display:inline-flex;align-items:center;padding:0 6px}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.tabbarin{pointer-events:auto;display:flex;gap:2px;width:min(520px,100%);
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 0;min-height:56px;border-radius:14px;
  color:var(--muted);font-size:12px;font-weight:700;transition:color .2s}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}

/* fab */
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 78px);inset-inline-start:50%;transform:translateX(50%);
  z-index:31;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:800;font-size:15px;padding:15px 24px;border-radius:999px;
  box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent),0 2px 6px rgba(0,0,0,.18);transition:transform .2s var(--spring),box-shadow .2s}
.fab:active{transform:translateX(50%) scale(.94)}
.fab.hidden{display:none}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:41;display:flex;justify-content:center;
  transform:translateY(105%);transition:transform .45s var(--spring)}
.sheet.show{transform:none}
.sheetin{width:min(520px,100%);max-height:88dvh;overflow-y:auto;background:var(--card);
  border-radius:24px 24px 0 0;border:1px solid var(--line);padding:14px 20px calc(env(safe-area-inset-bottom) + 22px)}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:2px auto 14px}
.sheetin h3{font-size:20px;font-weight:800;margin-bottom:16px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:7px}
.field input[type=text],.field input[type=number],.field select{
  width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;color:var(--text);font-size:16px;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus{border-color:var(--accent)}
.fieldrow{display:flex;gap:10px}
.fieldrow .field{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 16px;min-height:44px;border-radius:999px;background:var(--card2);border:1px solid var(--line);
  font-size:14px;font-weight:700;color:var(--muted);transition:all .2s var(--spring)}
.chip.on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);color:var(--accent)}
.timechips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.timechip2{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:11px;
  background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  color:var(--accent);font-size:14px;font-weight:700}
.timechip2 button{color:var(--accent);font-size:15px;line-height:1;opacity:.7}
input[type=time]{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--text);font-size:15px;font-family:inherit}
.btnrow{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:15px;min-height:52px;border-radius:14px;font-size:16px;font-weight:800;text-align:center;transition:transform .15s var(--spring)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.btn.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:28px;
  opacity:0;pointer-events:none;transition:opacity .25s}
.modal.show{opacity:1;pointer-events:auto}
.modalcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;max-width:400px;width:100%;
  transform:scale(.92);transition:transform .3s var(--spring)}
.modal.show .modalcard{transform:none}
.modalcard h4{font-size:17px;font-weight:800;margin-bottom:9px}
.modalcard p{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:16px}

/* toast */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 150px);left:50%;transform:translateX(-50%) translateY(80px);opacity:0;pointer-events:none;
  z-index:60;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:11px 20px;border-radius:999px;
  font-size:14px;font-weight:700;box-shadow:var(--shadow);transition:transform .4s var(--spring),opacity .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* empty */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .ic{font-size:44px;margin-bottom:12px;opacity:.8}
.empty h3{color:var(--text);font-size:17px;font-weight:800;margin-bottom:6px}
.empty p{font-size:13.5px;line-height:1.7}

/* welcome */
.welcome{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:30px;text-align:center}
.welcome.hide{display:none}
.wlogo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:20px;
  box-shadow:0 14px 40px color-mix(in srgb,var(--accent) 35%,transparent)}
.wlogo svg{width:34px;height:34px}
.welcome h1{font-size:27px;font-weight:800;margin-bottom:8px}
.welcome .sub{color:var(--muted);font-size:14.5px;line-height:1.8;max-width:330px;margin-bottom:22px}
.welcome input{width:min(330px,100%);height:48px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:0 16px;color:var(--text);font-size:16px;text-align:center;outline:none;margin-bottom:12px}
.welcome .fine{font-size:12px;color:var(--muted);line-height:1.7;max-width:320px;margin-top:14px}
.wbtn{width:min(330px,100%);height:52px;padding:0;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:16.5px;font-weight:800}
.wskip{margin-top:10px;min-height:44px;padding:0 18px;color:var(--muted);font-weight:700;font-size:14.5px}
.sectionlabel{font-size:12px;font-weight:800;color:var(--muted);margin:16px 4px 8px}
/* redesign additions */
.pbar{height:6px;border-radius:99px;background:var(--card2);margin-top:9px;overflow:hidden}
.pfill{height:100%;border-radius:99px;transition:width .5s var(--spring)}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheethead h3{margin-bottom:0}
.sdots{display:flex;gap:6px;align-items:center}
.sdot{width:8px;height:8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);transition:all .25s}
.sdot.on{width:22px;background:var(--accent);border-color:var(--accent)}
.sdot.done{background:color-mix(in srgb,var(--accent) 45%,transparent);border-color:transparent}
.btnrow.sticky{position:sticky;bottom:0;background:var(--card);padding-top:12px;padding-bottom:2px}
.lead{display:flex;gap:11px;align-items:flex-start;min-width:0}
.setic{color:var(--muted);flex:none;margin-top:2px}
.setic svg{width:19px;height:19px}
.dose .dot svg,.medrow .dot svg{width:22px;height:22px}
#f_icons .chip{width:48px;height:48px;min-height:48px;padding:0;display:inline-flex;align-items:center;justify-content:center}
#f_icons .chip svg{width:21px;height:21px}
.empty .ic svg{width:44px;height:44px;stroke-width:1.5}
.confetti{position:fixed;top:34%;inset-inline-start:50%;z-index:80;pointer-events:none}
.confetti i{position:absolute;width:8px;height:8px;border-radius:2px;opacity:0;animation:conf 1.2s ease-out var(--d) forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),230px) rotate(340deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.htitle{font-size:26px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="greet" id="greet"></div>
    <div class="htitle" id="htitle">اليوم</div>
  </header>
  <main id="view"></main>

  <button class="fab" id="fab"><span style="font-size:19px">+</span> دواء جديد</button>

  <div class="tabbar"><div class="tabbarin">
    <button class="tab on" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="4"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>اليوم</button>
    <button class="tab" data-tab="meds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 3.5 13.5a4.95 4.95 0 1 1 7-7l7 7a4.95 4.95 0 1 1-7 7Z"/><path d="m7 10 7 7"/></svg>أدويتي</button>
    <button class="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/></svg>السجل</button>

<script>
'use strict';
/* ============ state ============ */
const LS='dawaya.v1';
let S=load();

  return null;
}
function fresh(){return {profile:{name:'',theme:'auto',accent:'#10B981',notif:false,refill:true,seen:false},meds:[],log:{},notified:{}};}
if(!S){S=fresh();}
function save(){localStorage.setItem(LS,JSON.stringify(S));}
const $=q=>document.querySelector(q);
const view=$('#view');
let tab='today', editId=null;

const ICON_KEYS=['pill','bandage','syringe','droplet','drop','thermo','lungs','brain','heart','tooth','eye','bone'];
const ICON_SVG={
  pill:'<path d="M10.5 20.5 3.5 13.5a4.95 4.95 0 1 1 7-7l7 7a4.95 4.95 0 1 1-7 7Z"/><path d="m8.5 8.5 7 7"/>',

  drop:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/><path d="M9.5 15a2.5 2.5 0 0 0 2.5 2.5"/>',
  thermo:'<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>',

  brain:'<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M12 5v13"/>',
  heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  tooth:'<path d="M12 5.5c-1.5-1.5-3-2.5-5-2.5C4.5 3 3 4.8 3 7c0 4 2 6 2.5 9 .3 1.7.8 4 2 4 1.5 0 1.5-3 2-5 .3-1 .7-2 2.5-2s2.2 1 2.5 2c.5 2 .5 5 2 5 1.2 0 1.7-2.3 2-4 .5-3 2.5-5 2.5-9 0-2.2-1.5-4-4-4-2 0-3.5 1-5 2.5Z"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  bone:'<path d="M17 10c.7-.7 1.69 0 2.5 0a2.5 2.5 0 1 0 0-5 .5.5 0 0 1-.5-.5 2.5 2.5 0 1 0-5 0c0 .81.7 1.8 0 2.5l-7 7c-.7.7-1.69 0-2.5 0a2.5 2.5 0 0 0 0 5c.28 0 .5.22.5.5a2.5 2.5 0 1 0 5 0c0-.81-.7-1.8 0-2.5Z"/>'
};
const ICON_MIGRATE={'💊':'pill','🩹':'bandage','💉':'syringe','🧴':'droplet','🩸':'drop','🌡️':'thermo','🫁':'lungs','🧠':'brain','❤️':'heart','🦷':'tooth','👁️':'eye','🦴':'bone'};
function iconSvg(k){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_SVG[k]||ICON_SVG.pill}</svg>`;}
const COLORS=['#0E9F6E','#3B82F6','#8B5CF6','#F59E0B','#EF4444','#EC4899'];
const UNITS=['قرص','كبسولة','ملجم','مل','قطرة','حقنة','بخة','ملعقة'];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DAYS_S=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const DAY_INIT=['ح','ن','ث','ر','خ','ج','س'];
const UI_ICONS={
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/>',
  shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/>',
  down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  box:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/>'
};
function uiIcon(k){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${UI_ICONS[k]}</svg>`;}

/* ============ helpers ============ */
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>dkey(new Date());
function arTime(hm){
  const [h,m]=hm.split(':').map(Number);
  const per=h<12?'ص':'م';let hh=h%12;if(hh===0)hh=12;
  return toAr(hh)+':'+toAr(pad(m))+' '+per;
}
function toAr(x){return String(x).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[+d]);}
function arDate(d){return d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function vibrate(ms){try{navigator.vibrate&&navigator.vibrate(ms||10);}catch(e){}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),3000);}

/* ============ doses ============ */
function dosesFor(date){
  const out=[], dow=date.getDay(), dk=dkey(date);
  for(const m of S.meds){
    if(m.paused)continue;
    if(m.days&&m.days.length&&!m.days.includes(dow))continue;
    for(const t of m.times){
      const k=dk+'|'+m.id+'|'+t;
      out.push({med:m,time:t,key:k,status:(S.log[dk]&&S.log[dk][m.id+'|'+t])||null});
    }
  }
  out.sort((a,b)=>a.time<b.time?-1:1);
  return out;
}
function logDose(key,medId,time,st){
  const dk=key.split('|')[0];
  if(!S.log[dk])S.log[dk]={};
  const k2=medId+'|'+time;
  if(S.log[dk][k2]===st){delete S.log[dk][k2];unconsume(medId);}
  else{
    const prev=S.log[dk][k2];
    S.log[dk][k2]=st;
    if(st==='taken'&&prev!=='taken')consume(medId);
    if(st!=='taken'&&prev==='taken')unconsume(medId);
  }
  save();
}
function consume(medId){
  const m=S.meds.find(x=>x.id===medId);
  if(m&&typeof m.pillsLeft==='number'&&m.pillsLeft>0){m.pillsLeft--;}
}
function unconsume(medId){
  const m=S.meds.find(x=>x.id===medId);
  if(m&&typeof m.pillsLeft==='number'){m.pillsLeft++;}
}
function calcStreak(){
  let streak=0;
  for(let i=0;i<90;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=dosesFor(d);
    if(!ds.length)continue;
    const t=ds.filter(x=>x.status==='taken').length;
    if(t===ds.length){streak++;}
    else if(i===0){continue;}
    else break;
  }
  return streak;
}
function weekStrip(){
  let html='<div class="week">';
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=dosesFor(d);
    const t=ds.filter(x=>x.status==='taken').length;
    const s=ds.filter(x=>x.status==='skipped').length;
    let cls='',mark='·';
    if(ds.length){
      if(t===ds.length){cls='full';mark='✓';}
      else if(t+s===ds.length&&t>0){cls='part';mark=toAr(t);}
      else if(t+s===ds.length){cls='miss';mark='✕';}
      else if(i===0){cls='part';mark=toAr(t);}
      else{cls='miss';mark=toAr(t+s);}
    }
    html+=`<div class="wday"><div class="wdot ${cls} ${i===0?'today':''}">${mark}</div><div class="wlbl">${DAY_INIT[d.getDay()]}</div></div>`;
  }
  return html+'</div>';
}
function nextDose(){
  const now=new Date(), nowHm=pad(now.getHours())+':'+pad(now.getMinutes());
  for(const d of dosesFor(now))if(d.time>nowHm&&!d.status)return{...d,when:'اليوم '+arTime(d.time)};
  const tm=new Date(now);tm.setDate(tm.getDate()+1);
  const ds=dosesFor(tm);
  if(ds.length)return{...ds[0],when:'بكرة '+arTime(ds[0].time)};
  return null;
}

/* ============ render ============ */
const TITLES={today:'اليوم',meds:'أدويتي',history:'السجل',settings:'الإعدادات'};
function render(){
  $('#htitle').textContent=TITLES[tab];
  const h=new Date().getHours();
  const g=h<12?'صباح الخير':h<17?'نهارك سعيد':'مساء الخير';
  $('#greet').textContent=g+(S.profile.name?' يا '+S.profile.name:'')+' • '+arDate(new Date());
  $('#fab').classList.toggle('hidden',tab==='settings'||tab==='history');
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ({today:renderToday,meds:renderMeds,history:renderHistory,settings:renderSettings})[tab]();
}

function renderToday(){
  const ds=dosesFor(new Date());
  if(!S.meds.length){
    view.innerHTML=`<div class="empty"><div class="ic" style="color:var(--accent)">${iconSvg('pill')}</div><h3>مفيش أدوية لسه</h3><p>اضغط على "دواء جديد" وأضف أول دواء،<br>ودوايا هيفكّرك بمواعيده كل يوم.</p><button class="btn primary" style="max-width:230px;margin:18px auto 0;display:block" onclick="openSheet(null)">+ أضف أول دواء</button></div>`;
    return;
  }
  const taken=ds.filter(d=>d.status==='taken').length;
  const pct=ds.length?Math.round(taken/ds.length*100):0;
  const nd=nextDose();
  const missed=ds.filter(d=>!d.status&&d.time<pad(new Date().getHours())+':'+pad(new Date().getMinutes())&&d.time<pad((new Date().getHours()+23)%24)+':'+pad(new Date().getMinutes())&&pastMin(d.time)>60);
  const low=S.meds.filter(m=>!m.paused&&typeof m.pillsLeft==='number'&&m.pillsLeft<=(m.refillAt??5));
  const circ=2*Math.PI*24;
  const was=window._lastPct;window._lastPct=pct;
  let html=`<div class="card"><div class="hero">
    <div class="ring"><svg width="56" height="56"><circle class="track" cx="28" cy="28" r="24" fill="none" stroke-width="5"/>
    <circle class="bar" cx="28" cy="28" r="24" fill="none" stroke-width="5" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct/100)}"/></svg>
    <div class="pct"><bdi>${toAr(pct)}٪</bdi></div></div>
    <div class="heroinfo"><h2>${ds.length?`خدت ${toAr(taken)} من ${toAr(ds.length)} جرعات`:'مفيش جرعات النهاردة'}</h2>
    <p>${pct===100&&ds.length?'يوم كامل، برافو عليك 🎉':ds.length?'كمل، كل جرعة بتوثّق التزامك.':'استريح، مفيش حاجة مجدولة.'}</p></div>
    ${nd?`<span class="nextdose">⏰ الجرعة الجاية: ${esc(nd.med.name)} ${nd.when}</span>`:''}
    ${calcStreak()>0?`<span class="nextdose" style="background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn)">🔥 ${toAr(calcStreak())} ${calcStreak()===1?'يوم':'أيام'} التزام ورا بعض</span>`:''}
    </div>${weekStrip()}</div>`;
  if(missed.length)html+=`<div class="banner neutral">${uiIcon('clock')}<div>عندك ${toAr(missed.length)} ${missed.length===1?'جرعة فاتت':'جرعات فاتت'} من غير تسجيل. سجّلها لو خدتها، أو تخطَّها.</div></div>`;
  for(const m of low)html+=`<div class="banner warn">${uiIcon('bell')}<div><b>${esc(m.name)}</b> قرب يخلص (فاضل ${toAr(m.pillsLeft)} ${m.unit}). جدّد العلبة في أقرب صيدلية.</div></div>`;
  html+=`<div class="dayhead">جدول النهاردة</div>`;
  if(!ds.length)html+=`<div class="empty" style="padding:26px"><p>مفيش جرعات مجدولة النهاردة.</p></div>`;
  for(const d of ds){
    html+=`<div class="card dose pressable ${d.status==='taken'?'taken':''}">
      <span class="timechip">${arTime(d.time)}</span>
      <div class="dot" style="background:color-mix(in srgb,${d.med.color} 12%,transparent);color:${d.med.color}">${iconSvg(d.med.icon)}</div>
      <div class="info"><div class="name">${esc(d.med.name)}</div><div class="sub">${esc(d.med.dose)} ${esc(d.med.unit)}${typeof d.med.pillsLeft==='number'?' • فاضل '+toAr(d.med.pillsLeft):''}${!d.status&&pastMin(d.time)>60?' <span class="tag">اتفوّتت</span>':''}</div></div>
      <div class="acts">
        <button class="pillbtn ok ${d.status==='taken'?'on':''}" onclick="act('${d.key}','${d.med.id}','${d.time}','taken')" aria-label="خدتها">✓</button>
        <button class="pillbtn skip ${d.status==='skipped'?'on':''}" onclick="act('${d.key}','${d.med.id}','${d.time}','skipped')" aria-label="تخطيتها">✕</button>
      </div></div>`;
  }
  if(ds.length){
    html+=`<div class="adcard"><span class="adtag">إعلان</span><div class="adt">مساحة إعلانية صغيرة</div>
    <div class="ads">هنا هيظهر إعلان بسيط يساعدنا نخلي دوايا مجاني للكل.<br>مش هيظهر أبدًا فوق أزرار الجرعات أو يحجبها.</div></div>`;
  }
  view.innerHTML=html;
  if(pct===100&&ds.length&&was!==undefined&&was!==null&&was<100&&!matchMedia('(prefers-reduced-motion: reduce)').matches)confetti();
}
function confetti(){
  const c=document.createElement('div');c.className='confetti';
  const cols=['#0E9F6E','#F59E0B','#3B82F6','#EC4899','#16A34A'];
  for(let i=0;i<26;i++){const s=document.createElement('i');s.style.setProperty('--x',(Math.random()*240-120)+'px');s.style.setProperty('--d',(Math.random()*.35).toFixed(2)+'s');s.style.background=cols[i%cols.length];c.appendChild(s);}
  document.body.appendChild(c);setTimeout(()=>c.remove(),1700);
}
function pastMin(hm){const n=new Date();const[dh,dm]=hm.split(':').map(Number);return (n.getHours()*60+n.getMinutes())-(dh*60+dm);}
window.act=(key,medId,time,st)=>{vibrate(12);logDose(key,medId,time,st);render();
  if(st==='taken')toast('اتسجلت ✅ بالشفا');
  const m=S.meds.find(x=>x.id===medId);
  if(m&&S.profile.refill&&typeof m.pillsLeft==='number'&&m.pillsLeft<=(m.refillAt??5)&&m.pillsLeft>=0)toast('⚠️ '+m.name+' قرب يخلص');
};

function bestStreak(){
  let best=0,cur=0;
  for(let i=89;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=dosesFor(d);
    if(!ds.length)continue;
    const t=ds.filter(x=>x.status==='taken').length;
    if(t===ds.length){cur++;if(cur>best)best=cur;}else cur=0;
  }
  return best;
}
function timeGroup(t){const h=+t.split(':')[0];return h<12?0:h<17?1:2;}
const GROUPS=['الصبح','الظهر','المساء'];
function renderMeds(){
  if(!S.meds.length){view.innerHTML=`<div class="empty"><div class="ic" style="color:var(--muted)">${uiIcon('box')}</div><h3>قايمة أدويتك فاضية</h3><p>أضف أدويتك بمواعيدها، وهتلاقيها هنا.</p><button class="btn primary" style="max-width:230px;margin:18px auto 0;display:block" onclick="openSheet(null)">+ أضف أول دواء</button></div>`;return;}
  const groups=[[],[],[]];
  for(const m of S.meds){const ts=m.times&&m.times.length?[...m.times].sort():['12:00'];groups[timeGroup(ts[0])].push(m);}
  let html='';
  groups.forEach((arr,gi)=>{
    if(!arr.length)return;
    html+=`<div class="dayhead">${GROUPS[gi]}</div>`;
    for(const m of arr){
      const lowT=typeof m.pillsLeft==='number'&&m.pillsLeft<=(m.refillAt??5);
      const barPct=typeof m.pillsLeft==='number'?Math.max(4,Math.min(100,Math.round(m.pillsLeft/30*100))):null;
      html+=`<div class="card medrow pressable" onclick="openSheet('${m.id}')">
      <div class="dot" style="background:color-mix(in srgb,${m.color} 12%,transparent);color:${m.color}">${iconSvg(m.icon)}</div>
      <div class="info"><div class="name">${esc(m.name)}${m.paused?'<span class="tag">متوقف مؤقتًا</span>':''}${lowT?'<span class="tag low">قرب يخلص</span>':''}</div>
      <div class="sub">${esc(m.dose)} ${esc(m.unit)} • ${m.times.map(arTime).join('، ')}<br>
      <span class="tag">${m.days&&m.days.length?m.days.map(d=>DAYS_S[d]).join(' '):'كل يوم'}</span>${typeof m.pillsLeft==='number'?`<span class="tag">فاضل ${toAr(m.pillsLeft)}</span>`:''}</div>
      ${barPct!==null?`<div class="pbar"><div class="pfill" style="width:${barPct}%;background:${lowT?'var(--warn)':'var(--accent)'}"></div></div>`:''}</div>
      <span class="chev">‹</span></div>`;
    }
  });
  view.innerHTML=html;
}

function renderHistory(){
  const days=[];let totTaken=0,totAll=0,streak=0,streakOn=true;
  for(let i=13;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=dosesFor(d);const t=ds.filter(x=>x.status==='taken').length;const s=ds.filter(x=>x.status==='skipped').length;
    days.push({d,t,all:t+s,n:ds.length});
    if(i>0){totTaken+=t;totAll+=t+s;}
  }
  for(let i=0;i<14;i++){const x=days[13-i];
    if(x.n&&x.t===x.n){if(streakOn)streak++;}else if(x.n){streakOn=false;}}
  const rate=totAll?Math.round(totTaken/totAll*100):0;
  let html=`<div class="statrow">
    <div class="stat"><div class="n"><bdi>${toAr(rate)}٪</bdi></div><div class="l">نسبة الالتزام</div></div>
    <div class="stat"><div class="n">${toAr(bestStreak())}</div><div class="l">أفضل سلسلة أيام 🔥</div></div></div>
    <div class="card"><div class="dayhead" style="margin-top:2px">آخر ١٤ يوم</div><div class="bars">`;
  for(const x of days){
    const h=x.all?Math.max(8,Math.round(x.t/x.all*100)):(x.n?8:0);
    html+=`<div class="barcol"><div class="bar ${x.n?'':'none'}" style="height:${x.n?h+'%':'3px'}" title="${x.t}/${x.n}"></div><div class="barday">${DAY_INIT[x.d.getDay()]}</div></div>`;
  }
  html+=`</div></div><div class="banner info">${uiIcon('bulb')}<div>الالتزام بالدواء في معايده هو أهم حاجة لمفعوله. لو نسيت جرعة، سجّلها من صفحة اليوم.</div></div>`;
  html+=`<div class="adcard"><span class="adtag">إعلان</span><div class="adt">مساحة إعلانية صغيرة</div>
  <div class="ads">إعلان بسيط تحت السجل، بعيد عن أي زرار مهم.</div></div>`;
  view.innerHTML=html;
}

window.exportData=()=>{

window.importData=(ev)=>{
  const f=ev.target.files&&ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const obj=JSON.parse(rd.result);
      const d=(obj&&obj.app==='dawaya'&&obj.data)?obj.data:obj;
      if(!d||!Array.isArray(d.meds)||typeof d.log!=='object')throw 0;
      S=d; if(!S.profile)S.profile=fresh().profile; if(!S.notified)S.notified={};
      save();applyTheme();applyAccent();render();
      toast('رجعت بياناتك ✅');
    }catch(e){toast('الملف ده مش نسخة دوايا صالحة ⚠️');}
    ev.target.value='';
  };
  rd.readAsText(f);
};

/* ============ theme ============ */
function applyTheme(){
  const t=S.profile.theme==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):S.profile.theme;
  document.documentElement.dataset.theme=t;
  document.querySelector('meta[name=theme-color]').content=t==='light'?'#FAF8F4':'#0F1512';
  applyAccent();
}
function applyAccent(){
  let a=S.profile.accent;
  if(document.documentElement.dataset.theme==='dark'&&a==='#0E9F6E')a='#34D399';
  document.documentElement.style.setProperty('--accent',a);
  document.documentElement.style.setProperty('--accent2',shade(a,-18));
}
function shade(hex,p){const n=parseInt(hex.slice(1),16),f=v=>Math.max(0,Math.min(255,v));
  const r=f((n>>16)+p*2.55|0),g=f((n>>8&255)+p*2.55|0),b=f((n&255)+p*2.55|0);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(S.profile.theme==='auto')applyTheme();});

/* ============ notifications ============ */
async function notifyDue(){
  if(!S.profile.notif||!('Notification' in window)||Notification.permission!=='granted')return;
  const now=new Date(),dk=todayKey(),nowHm=pad(now.getHours())+':'+pad(now.getMinutes());
  if(!S.notified[dk])S.notified[dk]={};
  for(const d of dosesFor(now)){
    if(d.status||d.time>nowHm||pastMin(d.time)>20)continue;
    if(S.notified[dk][d.key])continue;
    S.notified[dk][d.key]=1;save();
    const body=`حان وقت ${d.med.name} - ${d.med.dose} ${d.med.unit}`;
    try{
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg)reg.showNotification('دوايا 💊 موعد دوائك',{body,dir:'rtl',lang:'ar',tag:d.key,icon:'icons/icon-192.png',badge:'icons/icon-192.png',vibrate:[120,60,120]});
      else new Notification('دوايا 💊 موعد دوائك',{body,dir:'rtl',lang:'ar',tag:d.key});
    }catch(e){try{new Notification('دوايا 💊 موعد دوائك',{body,tag:d.key});}catch(_){}}
  }
  const ks=Object.keys(S.notified);if(ks.length>7){ks.sort().slice(0,ks.length-7).forEach(k=>delete S.notified[k]);save();}
}
setInterval(notifyDue,20000);

/* ============ tabs ============ */
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;vibrate(8);render();window.scrollTo({top:0});}));

/* ============ welcome ============ */
if(!S.profile.seen){$('#welcome').classList.remove('hide');}
$('#wstart').addEventListener('click',()=>{
  S.profile.name=$('#wname').value.trim();S.profile.seen=true;save();
  $('#welcome').classList.add('hide');render();
});
$('#wskip').addEventListener('click',()=>{
  S.profile.seen=true;save();
  $('#welcome').classList.add('hide');render();
});

/* ============ boot ============ */
(function migrate(){
  let changed=false;
  for(const m of S.meds){
    if(ICON_MIGRATE[m.icon]){m.icon=ICON_MIGRATE[m.icon];changed=true;}
    else if(!ICON_SVG[m.icon]){m.icon='pill';changed=true;}
  }
  if(S.profile.accent==='#10B981'){S.profile.accent='#0E9F6E';changed=true;}
  if(changed)save();
})();
applyTheme();applyAccent();render();
(function(){if(!('serviceWorker' in navigator))return;var had=!!navigator.serviceWorker.controller,busy=false;function editing(){var a=document.activeElement;return !!((a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))||document.querySelector('#sheet.show,#modal.show'));}function go(){try{sessionStorage.setItem('sw-updated','1');}catch(e){}location.reload();}navigator.serviceWorker.addEventListener('controllerchange',function(){if(!had){had=true;return;}if(busy)return;if(!editing()){go();return;}busy=true;var t=setInterval(function(){if(!editing()){clearInterval(t);go();}},1000);});navigator.serviceWorker.register('sw.js').then(function(r){function up(){try{r.update();}catch(e){}}up();setInterval(up,600000);document.addEventListener('visibilitychange',function(){if(!document.hidden)up();});}).catch(function(){});try{if(sessionStorage.getItem('sw-updated')){sessionStorage.removeItem('sw-updated');setTimeout(function(){if(typeof toast==='function')toast('اتحدّث لآخر نسخة ✅');},600);}}catch(e){}})();
</script>
</body>
